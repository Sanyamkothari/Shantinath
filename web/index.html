<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Shantinath Agro Agency — Quality Seeds & Fertilizers for Better Yield. Order online.">

  <!-- PWA / iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shantinath Agro">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Splash screen color -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Shantinath Agro Agency</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash screen styling while Flutter loads -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F5F5F0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: fadeIn 0.5s ease-out;
    }

    .loading-logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(46, 125, 50, 0.15);
    }

    .loading-text {
      color: #2E7D32;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(46, 125, 50, 0.15);
      border-top-color: #2E7D32;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Branded loading screen shown while Flutter initializes -->
  <div class="loading-container" id="loading">
    <img src="icons/Icon-192.png" alt="Shantinath Agro" class="loading-logo">
    <div class="loading-text">Shantinath Agro Agency</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      console.error('GLOBAL JS ERROR:', e.error || e.message || e);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('UNHANDLED PROMISE REJECTION:', e.reason);
    });

    // Remove loading screen once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
