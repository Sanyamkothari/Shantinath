name: shantinath_agro
description: "Shantinath Agro Agency - Seed & Fertilizer Order Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  flutter_svg: ^2.0.17

  # State Management
  provider: ^6.1.5

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.0.1
  firebase_crashlytics: ^4.1.3

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: any
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  firebase_storage: ^12.4.10
  image_picker: ^1.2.2
  excel: ^4.0.6
  path_provider: ^2.1.3
  http: ^1.2.0 # calls the OTP Cloud Functions

  # Delivery memo PDF generation + printing/sharing
  pdf: ^3.11.1
  printing: ^5.13.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/Shantinath Agro Products/
    - assets/company logos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk warning prevention
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_padded.png"
